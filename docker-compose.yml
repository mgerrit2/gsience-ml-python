version: '3.8'

services:
  web-fast-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gsience-ml-python
    ports:
      - "8000:8000"
    volumes:
      # Mount project root so src/ and uploads/ stay synced
      - .:/app
    environment:
      - PORT=8000
    # Enable hot-reloading for local dev
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload